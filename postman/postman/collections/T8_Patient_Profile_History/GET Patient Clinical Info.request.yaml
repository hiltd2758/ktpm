$kind: http-request
url: "{{base_url}}/api/patient/clinical-info/{{patient_id}}"
method: GET
headers:
  Cookie: jwt-patient-token={{patient_token}}
auth:
  type: bearer
  credentials:
    token: "{{patient_token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response time is less than 1000ms\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(1000);\r

      });"
    language: text/javascript
order: 3000
