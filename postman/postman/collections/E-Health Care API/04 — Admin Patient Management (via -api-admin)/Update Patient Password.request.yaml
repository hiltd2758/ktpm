$kind: http-request
description: |-
  PUT /api/admin/patient/update/password/{id} — Updates a patient's password (BCrypt-encoded).

  Path variable: id (patient ID)
  Body: { newPassword: string }
  Source: AdminApiController.updatePatientPassword()
url: "{{base_url}}/api/admin/patient/update/password/{{patient_id}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "newPassword": "Patient@123"
    }
auth:
  type: bearer
  credentials:
    token: "{{admin_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200 OK or 400 if patient not found', function () {
          pm.expect([200, 400]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Success message present', function () {
              var body = pm.response.json();
              pm.expect(body).to.have.property('message');
          });
      }
    language: text/javascript
order: 2000
