$kind: http-request
description: |-
  POST /api/doctor/patient/{id} — Creates or updates the clinical record for a patient.

  Source: ConsultationApiController.updatePatientRecord(@PathVariable Long id, @RequestBody PatientClinicalInforDTO)
  DTO fields: bloodType, allergies, chronicDiseases, familyMedicalHistory
  The lastUpdatedById is set server-side from the authenticated doctor's identity.
url: "{{base_url}}/api/doctor/patient/{{patient_id}}"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "bloodType": "O+",
      "allergies": "Penicillin",
      "chronicDiseases": "Hypertension",
      "familyMedicalHistory": "Diabetes in father"
    }
auth:
  type: bearer
  credentials:
    token: "{{doctor_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200 OK or 404 patient not found', function () {
          pm.expect([200, 404]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Success message returned', function () {
              var body = pm.response.json();
              pm.expect(body).to.have.property('message');
          });
      }
    language: text/javascript
order: 6000
