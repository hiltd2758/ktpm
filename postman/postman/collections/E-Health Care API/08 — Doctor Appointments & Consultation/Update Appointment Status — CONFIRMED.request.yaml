$kind: http-request
description: |-
  POST /api/doctor/appointment/update/{id}/{status} — Changes appointment status.

  Path variables: id (appointment ID), status (PENDING | CONFIRMED | CANCELLED | COMPLETED)
  Source: DoctorApiController.updateStatus(@PathVariable Long id, @PathVariable String status)
  Note: The entity table is named 'consultation' in the DB.
url: "{{base_url}}/api/doctor/appointment/update/{{appointment_id}}/CONFIRMED"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{doctor_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200 OK or 400 not found', function () {
          pm.expect([200, 400]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Success message returned', function () {
              var body = pm.response.json();
              pm.expect(body).to.have.property('message');
          });
      }
    language: text/javascript
order: 2000
