$kind: http-request
description: |-
  GET /api/admin/generate-hash?password=<plain> — BCrypt hashes a password. Useful for seeding the database with correct password hashes.

  Source: AdminApiController → @RequestParam String password
  Security: permitAll (explicitly whitelisted in ApiSecurityConfiguration)
url: "{{base_url}}/api/admin/generate-hash?password=Admin@123"
method: GET
queryParams:
  - key: password
    value: Admin@123
    description: Plain-text password to hash with BCrypt
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response contains hash field', function () {
          var body = pm.response.json();
          pm.expect(body).to.have.property('hash');
          pm.expect(body.hash).to.be.a('string').and.to.match(/^\$2a\$/);
      });
    language: text/javascript
order: 3000
