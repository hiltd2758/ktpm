$kind: http-request
description: |-
  GET /api/doctors — Returns a summary list of all doctors. Public endpoint, no token required.

  Source: UserAPIController → DoctorSummaryDTO { id, email, fullName, phone, address }
url: "{{base_url}}/api/doctors"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response is an array', function () {
          var body = pm.response.json();
          pm.expect(body).to.be.an('array');
      });

      pm.test('Each doctor has id and email', function () {
          var body = pm.response.json();
          if (body.length > 0) {
              pm.expect(body[0]).to.have.property('id');
              pm.expect(body[0]).to.have.property('email');
              // Capture first doctor id for downstream tests
              pm.collectionVariables.set('doctor_id', String(body[0].id));
          }
      });
    language: text/javascript
order: 1000
