$kind: http-request
description: Negative test — verifies that invalid credentials return HTTP 401.
url: "{{base_url}}/api/patient/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "nobody@example.com",
      "password": "wrongpass"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401 Unauthorized', function () {
          pm.response.to.have.status(401);
      });

      pm.test('Error field present', function () {
          var body = pm.response.json();
          pm.expect(body).to.have.property('error');
      });
    language: text/javascript
order: 3000
