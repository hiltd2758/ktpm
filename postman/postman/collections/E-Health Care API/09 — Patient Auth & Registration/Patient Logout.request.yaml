$kind: http-request
description: |-
  POST /api/patient/logout — Clears SecurityContext and expires the jwt-patient-token cookie.

  Requires: Authorization: Bearer {{patient_token}}
url: "{{base_url}}/api/patient/logout"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{patient_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Logout message returned', function () {
          var body = pm.response.json();
          pm.expect(body).to.have.property('message');
      });
    language: text/javascript
order: 4000
