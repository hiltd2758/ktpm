$kind: http-request
description: |-
  GET /admin/api/patients — Returns wrapped response { success, message, data: Patient[] }.

  Source: AdminDashboardController.getAllPatients()
url: "{{base_url}}/admin/api/patients"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{admin_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response has success wrapper', function () {
          var body = pm.response.json();
          pm.expect(body).to.have.property('success');
          pm.expect(body.success).to.be.true;
          pm.expect(body).to.have.property('data');
      });

      pm.test('Data is array', function () {
          var body = pm.response.json();
          pm.expect(body.data).to.be.an('array');
          if (body.data.length > 0) {
              pm.collectionVariables.set('patient_id', String(body.data[0].id));
          }
      });
    language: text/javascript
order: 1000
