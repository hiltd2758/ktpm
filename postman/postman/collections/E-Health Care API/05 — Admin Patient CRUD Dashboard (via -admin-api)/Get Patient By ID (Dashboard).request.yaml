$kind: http-request
description: |-
  GET /admin/api/patients/{id} — Retrieves a single patient by ID.

  Source: AdminDashboardController.getPatientById(@PathVariable long id)
  Response: { success, message, data: Patient }
url: "{{base_url}}/admin/api/patients/{{patient_id}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{admin_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200 OK or 404 not found', function () {
          pm.expect([200, 404]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Patient data returned', function () {
              var body = pm.response.json();
              pm.expect(body.success).to.be.true;
              pm.expect(body.data).to.have.property('id');
              pm.expect(body.data).to.have.property('email');
          });
      }
    language: text/javascript
order: 2000
