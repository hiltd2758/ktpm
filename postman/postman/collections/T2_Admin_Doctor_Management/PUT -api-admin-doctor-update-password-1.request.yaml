$kind: http-request
name: PUT /api/admin/doctor/update/password/1
url: "{{base_url}}/api/admin/doctor/update/password/1"
method: PUT
headers:
  Authorization: Bearer {{admin_token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "newPassword": "newPassword123"
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.test("Status 200 OK", () => pm.response.to.have.status(200));
      pm.test("Password updated", () => pm.response.json().message.includes('thành công'));
    language: text/javascript
order: 3000
