$kind: http-request
description: "Đăng ký tài khoản patient mới. Mong đợi: 200 OK"
url: "{{base_url}}/api/patient/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "firstName": "Test",
      "lastName": "Patient",
      "email": "bugtest@gmail.com",
      "password": "123456",
      "phone": "0901234567",
      "dateOfBirth": "2000-01-01"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('STEP 1 - Register thành công', function() {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 1000
