$kind: http-request
description: Đổi password. Trả về 200 nhưng password bị lưu plain text → BUG xảy ra ngầm
url: "{{base_url}}/api/patient/update-profile"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{patient_token}}
body:
  type: text
  content: |-
    {
      "password": "newpassword123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('STEP 3 - Update trả về 200 (bug xảy ra ngầm)', function() {
          pm.response.to.have.status(200);
      });
      console.log('⚠️ BUG: password newpassword123 vừa được lưu plain text vào DB!');
    language: text/javascript
order: 3000
