$kind: http-request
description: "Login bằng password gốc. Mong đợi: 200 OK + có token"
url: "{{base_url}}/api/patient/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "bugtest@gmail.com",
      "password": "123456"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('STEP 2 - Login thành công', function() {
          pm.response.to.have.status(200);
      });

      var json = pm.response.json();
      if (json.token) {
          pm.collectionVariables.set('patient_token', json.token);
          console.log('Token đã lưu: ' + json.token);
      } else {
          console.log('Không tìm thấy token, kiểm tra lại response');
          console.log(JSON.stringify(json));
      }
    language: text/javascript
order: 2000
