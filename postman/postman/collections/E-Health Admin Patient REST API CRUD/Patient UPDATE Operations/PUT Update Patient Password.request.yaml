$kind: http-request
description: Update patient password. Only the password endpoint accepts password updates.
url: "{{baseUrl}}/admin/api/patients/{{patientId}}/password"
method: PUT
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "newPassword": "NewSecurePassword456!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response indicates successful password update', function () {
          let jsonData = pm.response.json();
          pm.expect(jsonData.success).to.equal(true);
          pm.expect(jsonData.message).to.include('password').and.to.include('updated');
      });
    language: text/javascript
order: 2000
