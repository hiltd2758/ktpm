$kind: http-request
name: POST /api/patient/login
url: "{{base_url}}/api/patient/login"
method: POST
headers:
  Authorization: Bearer {{admin_token}}
body:
  type: json
  content: "{\r

    \  \"email\": \"email1@gmail.com\",\r

    \  \"password\": \"Admin123!\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status 200\", () => pm.response.to.have.status(200));\r

      pm.environment.set(\"patient_token\", pm.response.json().token);"
    language: text/javascript
order: 3000
