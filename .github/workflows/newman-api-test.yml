# ============================================================

# E-Health Care API - Newman CI/CD Pipeline

# ============================================================

name: E-Health Care API Tests

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - "**"

  workflow_dispatch:
    inputs:
      newman_delay:
        description: "Inter-request delay (ms)"
        required: false
        default: "300"

# ============================================================

# Global Environment Variables

# ============================================================

env:
APP_PORT: 8080

DB_PORT: 3307
DB_NAME: e_health
DB_USER: root
DB_PASS: root

COLLECTION: postman/E-Health-Care-API.postman_collection.json
ENV_FILE: /tmp/ehc-environment.json

REPORTS_DIR: reports

REQUEST_TIMEOUT_MS: 15000
NEWMAN_DELAY_MS: ${{ github.event.inputs.newman_delay || '300' }}

# ============================================================

# Job

# ============================================================

jobs:
api-test:


name: Build → Seed → Test
runs-on: ubuntu-latest

timeout-minutes: 25

permissions:
  checks: write
  contents: read

steps:

  # ------------------------------------------------------
  # Checkout & Setup
  # ------------------------------------------------------

  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Java 21
    uses: actions/setup-java@v4
    with:
      java-version: "21"
      distribution: temurin
      cache: maven

  - name: Cache Maven Repository
    uses: actions/cache@v4
    with:
      path: ~/.m2/repository
      key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
      restore-keys: |
        ${{ runner.os }}-maven-

  - name: Setup Node.js 20
    uses: actions/setup-node@v4
    with:
      node-version: "20"

  - name: Install Newman + Reporters
    run: |
      npm install -g \
        newman \
        newman-reporter-junitfull \
        newman-reporter-htmlextra

      newman --version

  # ------------------------------------------------------
  # Infrastructure
  # ------------------------------------------------------

  - name: Start MySQL
    run: |
      docker compose up -d mysql-local
      # wait until healthy

  # ------------------------------------------------------
  # Build & Run Application
  # ------------------------------------------------------

  - name: Build Spring Boot
    working-directory: web
    run: mvn package -DskipTests --no-transfer-progress -q

  - name: Start Spring Boot
    working-directory: web
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:${{ env.DB_PORT }}/${{ env.DB_NAME }}
      SPRING_DATASOURCE_USERNAME: ${{ env.DB_USER }}
      SPRING_DATASOURCE_PASSWORD: ${{ env.DB_PASS }}
    run: |
      java -jar target/*.jar \
        --server.port=${APP_PORT} \
        --spring.jpa.hibernate.ddl-auto=update \
        > /tmp/springboot.log 2>&1 &

  # ------------------------------------------------------
  # Database Seed
  # ------------------------------------------------------

  - name: Generate BCrypt Hashes & Seed Database
    env:
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      DOCTOR_EMAIL: ${{ secrets.DOCTOR_EMAIL }}
      DOCTOR_PASSWORD: ${{ secrets.DOCTOR_PASSWORD }}

      PATIENT_EMAIL: ${{ secrets.PATIENT_EMAIL }}
      PATIENT_PASSWORD: ${{ secrets.PATIENT_PASSWORD }}
    run: |
      # generate hashes
      # create seed.sql
      # execute seed.sql

  - name: Verify Seed Data
    run: |
      # mysql select statements

  # ------------------------------------------------------
  # Smoke Test
  # ------------------------------------------------------

  - name: Verify Login APIs
    env:
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      DOCTOR_EMAIL: ${{ secrets.DOCTOR_EMAIL }}
      DOCTOR_PASSWORD: ${{ secrets.DOCTOR_PASSWORD }}
    run: |
      # curl admin login
      # curl doctor login

  # ------------------------------------------------------
  # Newman Environment
  # ------------------------------------------------------

  - name: Create Reports Directory
    run: mkdir -p ${{ env.REPORTS_DIR }}

  - name: Generate Newman Environment
    env:
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      DOCTOR_EMAIL: ${{ secrets.DOCTOR_EMAIL }}
      DOCTOR_PASSWORD: ${{ secrets.DOCTOR_PASSWORD }}

      PATIENT_EMAIL: ${{ secrets.PATIENT_EMAIL }}
      PATIENT_PASSWORD: ${{ secrets.PATIENT_PASSWORD }}
    run: |
      # create environment json

  # ------------------------------------------------------
  # Execute Newman
  # ------------------------------------------------------

  - name: Run Newman Collection
    id: newman
    continue-on-error: true
    run: |
      newman run "${COLLECTION}" \
        --environment "${ENV_FILE}" \
        --reporters cli,junitfull,htmlextra \
        --reporter-junitfull-export "${REPORTS_DIR}/junit.xml" \
        --reporter-htmlextra-export "${REPORTS_DIR}/index.html" \
        --delay-request "${NEWMAN_DELAY_MS}" \
        --timeout-request "${REQUEST_TIMEOUT_MS}"

      echo "newman_exit=$?" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------
  # Diagnostics
  # ------------------------------------------------------

  - name: Print Spring Boot Logs
    if: failure() || steps.newman.outcome == 'failure'
    run: |
      tail -100 /tmp/springboot.log || true

  # ------------------------------------------------------
  # Reports
  # ------------------------------------------------------

  - name: Upload HTML Report
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: newman-html-report-${{ github.run_number }}
      path: reports/index.html

  - name: Upload JUnit Report
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: newman-junit-report-${{ github.run_number }}
      path: reports/junit.xml

  - name: Publish JUnit Results
    if: always()
    uses: mikepenz/action-junit-report@v4
    with:
      report_paths: reports/junit.xml
      fail_on_failure: true
      require_tests: true
      check_name: Newman API Test Results

  # ------------------------------------------------------
  # Cleanup
  # ------------------------------------------------------

  - name: Stop Containers
    if: always()
    run: |
      docker compose down --volumes --remove-orphans || true

  - name: Fail Workflow if Newman Failed
    if: steps.newman.outputs.newman_exit != '0'
    run: |
      exit 1

