name: API Test — Newman

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'local'
        type: choice
        options:
          - local

jobs:
  api-test:
    name: Run Newman Collection
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Start MySQL via Docker Compose ───────────────────────────────
      - name: Start MySQL
        run: |
          docker compose up -d mysql-local
          echo "Waiting for MySQL to be healthy..."
          for i in $(seq 1 40); do
            if docker exec mysql-local mysqladmin ping -h localhost -uroot -proot --silent 2>/dev/null; then
              echo "MySQL is ready after $i attempts"
              break
            fi
            echo "Attempt $i/40..."
            sleep 3
            if [ $i -eq 40 ]; then
              echo "MySQL failed to start"
              docker compose logs mysql-local
              exit 1
            fi
          done

      # ── 3. Build & start Spring Boot app ────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build Spring Boot app
        working-directory: web
        run: mvn package -DskipTests -q

      - name: Start Spring Boot app
        working-directory: web
        run: |
          # Tạo thư mục upload để tránh crash khi chạy jar
          mkdir -p src/main/resources/static/img/avatars/

          java -jar target/*.jar \
            --spring.datasource.url=jdbc:mysql://localhost:3307/e_health \
            --spring.datasource.username=root \
            --spring.datasource.password=root \
            > /tmp/springboot.log 2>&1 &

          echo "Waiting for Spring Boot to start..."
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/doctors)
            if echo "$STATUS" | grep -qE "^(200|401|403)"; then
              echo "App is ready after $i attempts (HTTP $STATUS)"
              break
            fi
            echo "Attempt $i/60 (HTTP $STATUS)..."
            if [ $((i % 10)) -eq 0 ]; then
              echo "=== Spring Boot log (last 20 lines) ==="
              tail -20 /tmp/springboot.log
            fi
            sleep 5
            if [ $i -eq 60 ]; then
              echo "=== FULL Spring Boot log ==="
              cat /tmp/springboot.log
              exit 1
            fi
          done

      # ── 4. Seed database (after Hibernate creates tables) ───────────────
      - name: Seed database
        run: |
          docker exec mysql-local mysql -uroot -proot e_health -e "
          INSERT IGNORE INTO admin (email, password, ROLE) VALUES
          ('${{ secrets.ADMIN_EMAIL }}', '\$2a\$10\$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy', 'ROLE_ADMIN');

          INSERT IGNORE INTO Doctor (email, password, first_name, last_name, field, phone, address, ROLE, avatar) VALUES
          ('${{ secrets.DOCTOR_EMAIL }}', '\$2a\$10\$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy', 'Nguyen', 'Van A', 'Cardiology', '0901234567', 'Ho Chi Minh City', 'ROLE_DOCTOR', 'default-avatar.png');

          INSERT IGNORE INTO Patient (email, password, first_name, last_name, phone, address, date_of_birth, medical_history, avatar) VALUES
          ('${{ secrets.PATIENT_EMAIL }}', '\$2a\$10\$92IXUNpkjO0rOQ5byMi.Ye4oKoEa3Ro9llC/.og/at2uheWG/igi.', 'Tran', 'Thi B', '0912345678', 'Ha Noi', '1995-08-20', 'None', 'default-avatar.png');
          "

      # ── 5. Install Newman ────────────────────────────────────────────────
      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      # ── 6. Prepare environment file (jq — an toàn với ký tự đặc biệt) ───
      - name: Prepare environment file
        env:
          ADMIN_EMAIL:      ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD:   ${{ secrets.ADMIN_PASSWORD }}
          DOCTOR_EMAIL:     ${{ secrets.DOCTOR_EMAIL }}
          DOCTOR_PASSWORD:  ${{ secrets.DOCTOR_PASSWORD }}
          PATIENT_EMAIL:    ${{ secrets.PATIENT_EMAIL }}
          PATIENT_PASSWORD: ${{ secrets.PATIENT_PASSWORD }}
        run: |
          jq -n \
            --arg base_url         "http://localhost:8080" \
            --arg admin_email      "$ADMIN_EMAIL" \
            --arg admin_password   "$ADMIN_PASSWORD" \
            --arg doctor_email     "$DOCTOR_EMAIL" \
            --arg doctor_password  "$DOCTOR_PASSWORD" \
            --arg patient_email    "$PATIENT_EMAIL" \
            --arg patient_password "$PATIENT_PASSWORD" \
            '{
              name: "EHC_Environment",
              values: [
                { key: "base_url",         value: $base_url,         enabled: true },
                { key: "admin_token",      value: "",                enabled: true },
                { key: "doctor_token",     value: "",                enabled: true },
                { key: "patient_token",    value: "",                enabled: true },
                { key: "admin_email",      value: $admin_email,      enabled: true },
                { key: "admin_password",   value: $admin_password,   enabled: true },
                { key: "doctor_email",     value: $doctor_email,     enabled: true },
                { key: "doctor_password",  value: $doctor_password,  enabled: true },
                { key: "patient_email",    value: $patient_email,    enabled: true },
                { key: "patient_password", value: $patient_password, enabled: true },
                { key: "patient_id",       value: "1",               enabled: true },
                { key: "doctor_id",        value: "1",               enabled: true },
                { key: "appointment_id",   value: "1",               enabled: true }
              ]
            }' > /tmp/ehc-env.json

      # ── 7. Run Newman ────────────────────────────────────────────────────
      - name: Run Newman
        run: |
          mkdir -p reports
          newman run postman/E-Health-Care-API.postman_collection.json \
            --environment /tmp/ehc-env.json \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export reports/newman-report.html \
            --reporter-htmlextra-title "E-Health Care API Test Report" \
            --delay-request 200 \
            --timeout-request 10000 \
            --color on \
            --bail

      # ── 8. Upload HTML report as artifact ───────────────────────────────
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report-${{ github.run_number }}
          path: reports/newman-report.html
          retention-days: 30