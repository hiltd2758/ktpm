name: API Test — Newman

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'local'
        type: choice
        options:
          - local

jobs:
  api-test:
    name: Run Newman Collection
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Start MySQL via Docker Compose ───────────────────────────────
      - name: Start MySQL
        run: |
          docker compose up -d mysql-local
          echo "Waiting for MySQL to be healthy..."
          for i in $(seq 1 30); do
            if docker exec mysql-local mysqladmin ping -h localhost -uroot -proot --silent 2>/dev/null; then
              echo "MySQL is ready"
              break
            fi
            echo "Attempt $i/30..."
            sleep 3
          done

      # ── 3. Build & start Spring Boot app ────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build Spring Boot app
        working-directory: web
        run: mvn package -DskipTests -q

      - name: Start Spring Boot app
        working-directory: web
        run: |
          java -jar target/*.jar \
            --spring.datasource.url=jdbc:mysql://localhost:3307/e_health \
            --spring.datasource.username=root \
            --spring.datasource.password=root \
            &
          echo "Waiting for app to start..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/api/doctors > /dev/null 2>&1; then
              echo "App is ready"
              break
            fi
            echo "Attempt $i/30..."
            sleep 3
          done

      # ── 4. Install Newman ────────────────────────────────────────────────
      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      # ── 5. Prepare environment file with real credentials ────────────────
      - name: Prepare environment file
        run: |
          cat > /tmp/ehc-env.json << 'EOF'
          {
            "name": "EHC_Environment",
            "values": [
              { "key": "base_url",         "value": "http://localhost:8080", "enabled": true },
              { "key": "admin_token",      "value": "",                      "enabled": true },
              { "key": "doctor_token",     "value": "",                      "enabled": true },
              { "key": "patient_token",    "value": "",                      "enabled": true },
              { "key": "admin_email",      "value": "${{ secrets.ADMIN_EMAIL }}",    "enabled": true },
              { "key": "admin_password",   "value": "${{ secrets.ADMIN_PASSWORD }}", "enabled": true },
              { "key": "doctor_email",     "value": "${{ secrets.DOCTOR_EMAIL }}",   "enabled": true },
              { "key": "doctor_password",  "value": "${{ secrets.DOCTOR_PASSWORD }}", "enabled": true },
              { "key": "patient_email",    "value": "${{ secrets.PATIENT_EMAIL }}",  "enabled": true },
              { "key": "patient_password", "value": "${{ secrets.PATIENT_PASSWORD }}", "enabled": true },
              { "key": "patient_id",       "value": "1",                     "enabled": true },
              { "key": "doctor_id",        "value": "1",                     "enabled": true },
              { "key": "appointment_id",   "value": "1",                     "enabled": true }
            ]
          }
          EOF

      # ── 6. Run Newman ────────────────────────────────────────────────────
      - name: Run Newman
        run: |
          newman run postman/E-Health Care API.postman_collection.json \
            --environment /tmp/ehc-env.json \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export reports/newman-report.html \
            --reporter-htmlextra-title "E-Health Care API Test Report" \
            --delay-request 200 \
            --timeout-request 10000 \
            --color on \
            --bail

      # ── 7. Upload HTML report as artifact ───────────────────────────────
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report-${{ github.run_number }}
          path: reports/newman-report.html
          retention-days: 30