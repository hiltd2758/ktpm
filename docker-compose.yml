version: "3.8"

services:
  mysql-local:
    image: mysql:8.0
    container_name: mysql-local
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: e_health_care
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: e-health-care-web
    environment:
      DB_URL: jdbc:mysql://mysql-local:3306/e_health_care?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: root
      DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      mysql-local:
        condition: service_healthy
    restart: on-failure

volumes:
  mysql_data: