  services:
    mysql-local:
      image: mysql:8.0
      container_name: mysql-local
      environment:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_DATABASE: e_health
      ports:
        - "3307:3306"
      volumes:
        - mysql_data:/var/lib/mysql
        - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
        interval: 10s
        timeout: 5s
        retries: 5

  volumes:
    mysql_data: