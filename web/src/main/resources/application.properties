spring.application.name=web
server.port=8080

# Datasource - reads from environment variables, falls back to local defaults
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/e_health_care?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
# DDL_AUTO=update for dev/local, override with "validate" for production
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
app.upload.dir=src/main/resources/static/img/avatars/

